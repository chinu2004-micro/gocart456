  <!-- Tagline: GENERAL SHOPPING (Small, wide-tracked charcoal capitals) -->
  <text
    x="87"
    y="60"
    font-family="'Inter', -apple-system, sans-serif"
    font-size="8.5"
    font-weight="600"
    letter-spacing="5"
