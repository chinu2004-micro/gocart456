      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 36 30 C 36 22, 44 20, 50 26 C 56 20, 64 22, 64 30 C 64 42, 50 62, 50 62"
      stroke="url(#velloraFullRibbon)"
