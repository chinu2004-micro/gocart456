<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="velloraFullRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E8C9B" />
      <stop offset="60%" stop-color="#0E4A57" />
      <stop offset="100%" stop-color="#D9B65F" />
    </linearGradient>
  </defs>

  <!-- Left Mark (scale and positioned) -->
  <g transform="translate(10, 8) scale(0.64)">
    <path
      d="M 22 28 C 22 16, 40 14, 50 25 C 60 14, 78 16, 78 28 C 78 46, 54 78, 50 84 C 46 78, 22 46, 22 28 Z"
      stroke="url(#velloraFullRibbon)"
