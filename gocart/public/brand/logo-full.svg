      />
    </g>
  </g>

  <!-- Wordmark: VELLORA (High contrast serif style) -->
  <text
    x="85"
    y="44"
    font-family="'Playfair Display', 'Cormorant Garamond', 'Georgia', serif"
    font-size="32"
    font-weight="700"
    letter-spacing="3"
